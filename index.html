<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3e0b8" />
    <meta name="robots" content="noindex" />
    <title>Guest Wi‑Fi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene">
      <img
        class="photo"
        src="room.jpg"
        alt=""
        width="576"
        height="1024"
      />
    </div>

    <main class="sheet">
      <section class="card" aria-labelledby="greeting">
        <h1 id="greeting">Welcome Home</h1>

        <div class="row">
          <span class="label">Network</span>
          <span class="value" id="ssid">WhiteSky-Chandler</span>
        </div>

        <div class="divider"></div>

        <div class="row">
          <span class="label">Password</span>
          <span class="value password" id="password">1d711156</span>
        </div>

        <button type="button" class="copy" id="copy-btn">
          <span class="tide"></span>
          <span class="shine"></span>
          <svg class="check" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12.5l4.2 4.2L19 7.8" />
          </svg>
          <span class="copy-label">Copy password</span>
        </button>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">
      Copied
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
